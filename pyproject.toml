[project]
name = "indodiscourse-multitask-experiment"
version = "0.1.0"
description = "Kaggle experiment comparing single-task and multi-task IndoBERTweet models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Muhammad Hafiz Ardiansyah" }]
keywords = ["IndoDiscourse", "toxicity", "polarization", "multi-task-learning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
